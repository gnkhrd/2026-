<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>일정표 · 2026년 정책연수</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>일정표</h1>
      <div class="sub">시간·순서는 현장 사정에 따라 바뀔 수 있어요</div>
    </div>
  </div>

  <div class="day-tabs" id="day-tabs"></div>
  <div class="schedule-grid" id="schedule-grid"></div>
</div>

<script src="assets/config.js"></script>
<script src="assets/mockdata.js"></script>
<script src="assets/api.js"></script>
<script src="assets/util.js"></script>
<script>
let ALL = [];
let DATES = []; // Schedule 시트에 실제로 존재하는 날짜들 (고정된 CONFIG.EVENT_DATES가 아니라 데이터 기준으로 동적 계산)
let currentDate = "";

function dayLabel(dateStr, idx) {
  const d = new Date(dateStr + "T00:00:00");
  return `${idx+1}일차 (${d.getMonth()+1}/${d.getDate()})`;
}

function renderTabs() {
  const tabsEl = document.getElementById("day-tabs");
  tabsEl.innerHTML = DATES.map((d, i) =>
    `<button data-date="${d}" class="${d === currentDate ? "active" : ""}">${dayLabel(d, i)}</button>`
  ).join("");
  tabsEl.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentDate = btn.dataset.date;
      renderTabs();
      document.querySelectorAll(".day-col").forEach(el => {
        el.classList.toggle("active", el.dataset.date === currentDate);
      });
    });
  });
}

// 모바일에서는 선택된 하루만 보이고(day-tabs로 전환), PC에서는 CSS가
// .day-col을 전부 강제로 보이게 해서 등록된 날짜 수만큼 나란히 표시됩니다.
// 날짜 목록(DATES)은 Schedule 시트에 실제로 입력된 날짜에서 뽑아오므로, 몇 일치 일정이든 자동으로 반영됩니다.
// 제목이 "주제발표N" / "사례발표N-M" 형식으로 시작하면 라벨과 설명을 분리해 3줄(라벨/설명/발표자)로 표시
function splitSessionTitle(title) {
  const m = String(title || "").match(/^(주제발표\d+|사례발표\d+-\d+)\s+(.+)$/);
  if (!m) return null;
  return { label: m[1], desc: m[2] };
}

function renderSchedule() {
  const grid = document.getElementById("schedule-grid");
  if (!DATES.length) {
    grid.innerHTML = '<div class="empty">등록된 일정이 없습니다. Google Sheet의 Schedule 탭을 확인해주세요.</div>';
    return;
  }
  grid.innerHTML = DATES.map((d, i) => {
    const rows = ALL.filter(r => r.date === d).sort((a,b) => a.time.localeCompare(b.time));
    const body = rows.length
      ? rows.map(r => {
          const split = splitSessionTitle(r.title);
          const content = split
            ? `<div class="title-label">${split.label}</div><div class="title">${split.desc}</div>`
            : `<div class="title">${r.title}</div>`;
          return `
          <div class="timeline-item">
            <div class="t">${fmtTimeRange(r.time)}</div>
            <div class="content">
              ${content}
              ${r.speaker ? `<div class="speaker">${r.speaker}</div>` : ""}
            </div>
          </div>
        `;
        }).join("")
      : '<div class="empty">등록된 일정이 없습니다.</div>';
    return `
      <div class="day-col card ${d === currentDate ? "active" : ""}" data-date="${d}">
        <div class="day-col-title">${dayLabel(d, i)}</div>
        ${body}
      </div>
    `;
  }).join("");
}

async function load() {
  const res = await API.getSchedule();
  ALL = (res.ok ? res.list : []).map(r => ({ ...r, date: normDate(r.date) }));
  DATES = [...new Set(ALL.map(r => r.date))].filter(Boolean).sort();
  if (!DATES.includes(currentDate)) currentDate = DATES[0] || "";
  renderTabs();
  renderSchedule();
}
load();
setInterval(load, 30000); // 30초마다 변경사항 자동 반영
</script>
</body>
</html>
