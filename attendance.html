<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>출석체크 · 2026년 정책연수</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>출석체크</h1>
      <div class="sub">사번과 성명을 입력하면 출석 인증됩니다</div>
    </div>
  </div>

  <div id="window-notice"></div>

  <div class="card">
    <div class="field">
      <label>사번</label>
      <input type="text" id="empId" autocapitalize="characters" placeholder="실제 사번으로 대/소문자 구분 입력(GN00000)">
    </div>
    <div class="field">
      <label>성명</label>
      <input type="text" id="name" placeholder="예: 김민준">
    </div>
    <div id="result"></div>
    <button class="btn btn-primary" id="submit-btn">출석 인증하기</button>
  </div>

  <div class="section-title">
    <span>실시간 출석 현황</span>
  </div>
  <div class="card ci-fill-card">
    <div class="ci-fill-wrap">
      <img class="ci-fill-img ci-fill-base" src="assets/brand/gn-ci-kr.png" alt="굿네이버스">
      <div class="ci-fill-clip" id="ci-fill-clip">
        <img class="ci-fill-img" src="assets/brand/gn-ci-kr.png" alt="">
      </div>
    </div>
    <div class="gauge-bar" style="margin-top:18px;"><div class="gauge-fill" id="gauge-fill" style="width:0%"></div></div>
    <div class="gauge-text" id="gauge-text">0 / 0명</div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/mockdata.js"></script>
<script src="assets/api.js"></script>
<script src="assets/util.js"></script>
<script>
// 권역/직급별 세부 통계 없이, "지금 몇 명이 모였는지"만 보여줍니다:
// (1) GN CI 로고를 출석 비율만큼 색이 채워지도록, (2) 그 아래 진행률 바 + 인원수.
async function refreshVisuals(count) {
  const rc = await API.getRosterCount();
  const total = rc.ok ? rc.count : 0;
  const pct = total ? Math.min(100, Math.round((count / total) * 100)) : 0;
  document.getElementById("ci-fill-clip").style.width = pct + "%";
  document.getElementById("gauge-fill").style.width = pct + "%";
  document.getElementById("gauge-text").textContent = `${count} / ${total || "?"}명 (${pct}%)`;
}

async function refreshList() {
  const res = await API.getAttendanceList();
  refreshVisuals(res.ok ? res.list.length : 0);
}

function checkWindow() {
  const w = isWithinAttendanceWindow();
  const el = document.getElementById("window-notice");
  const btn = document.getElementById("submit-btn");
  if (!w.ok) {
    el.innerHTML = `<div class="notice warning">${w.reason}</div>`;
    btn.disabled = true;
  } else {
    el.innerHTML = "";
    btn.disabled = false;
  }
}

document.getElementById("submit-btn").addEventListener("click", async () => {
  const empId = document.getElementById("empId").value.trim();
  const name = document.getElementById("name").value.trim();
  const resultEl = document.getElementById("result");
  if (!empId || !name) {
    resultEl.innerHTML = '<div class="notice error">사번과 성명을 모두 입력해주세요.</div>';
    return;
  }
  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "확인 중...";
  const res = await API.checkIn({ empId, name });
  btn.disabled = false; btn.textContent = "출석 인증하기";
  const qrUrl = `qr-card.html?empId=${encodeURIComponent(empId)}&name=${encodeURIComponent(name)}`;
  if (res.ok) {
    setMyEmpId(empId);
    setMyName(name);
    resultEl.innerHTML = `
      <div class="notice success">출석 인증이 완료되었습니다. 반갑습니다!</div>
      <a class="btn btn-primary" href="${qrUrl}" style="margin-bottom:14px;">🪪 내 QR 명함 만들러 가기</a>
    `;
    refreshList();
  } else if (String(res.message || "").includes("이미 출석 처리되었습니다")) {
    // 이미 다른 기기(PC 등)에서 출석체크를 완료한 경우입니다. 사번/성명은 명단과 이미 대조되어
    // 유효하다는 뜻이므로, 이 기기(브라우저)에도 신원을 저장해줘야 라이브포럼 등 출석 확인이
    // 필요한 다른 화면들이 이 기기에서도 정상적으로 열립니다.
    setMyEmpId(empId);
    setMyName(name);
    resultEl.innerHTML = `
      <div class="notice info">이미 다른 기기(또는 브라우저)에서 출석체크를 완료하셨네요. 이 기기에도 확인 정보를 저장했어요.</div>
      <a class="btn btn-primary" href="${qrUrl}" style="margin-bottom:14px;">🪪 내 QR 명함 만들러 가기</a>
    `;
  } else {
    resultEl.innerHTML = `<div class="notice error">${res.message}</div>`;
  }
});

checkWindow();
refreshList();
setInterval(refreshList, 8000);
</script>
</body>
</html>
