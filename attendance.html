<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>출석체크 · 2026년 정책연수</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>출석체크</h1>
      <div class="sub">사번과 성명을 입력하면 출석 인증됩니다</div>
    </div>
  </div>

  <div id="window-notice"></div>

  <div class="card">
    <div class="field">
      <label>사번</label>
      <input type="text" id="empId" autocapitalize="characters" placeholder="실제 사번으로 대/소문자 구분 입력(GN00000)">
    </div>
    <div class="field">
      <label>성명</label>
      <input type="text" id="name" placeholder="예: 홍길동">
    </div>
    <div id="result"></div>
    <button class="btn btn-primary" id="submit-btn">출석 인증하기</button>
  </div>

  <div class="section-title">
    <span>실시간 출석 현황</span>
  </div>
  <div class="card ci-fill-card">
    <div class="ci-fill-wrap">
      <img class="ci-fill-img ci-fill-base" src="gn-ci-kr.png" alt="굿네이버스">
      <div class="ci-fill-clip" id="ci-fill-clip">
        <img class="ci-fill-img" src="gn-ci-kr.png" alt="">
      </div>
    </div>
    <div class="crowd-caption">지금 이 순간, 정책연수에 모인 동료들</div>
    <div class="crowd-grid" id="crowd-grid"></div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/mockdata.js"></script>
<script src="assets/api.js"></script>
<script src="assets/util.js"></script>
<script>
// 권역/직급별 세부 통계, 전체 인원수, 퍼센트 같은 숫자는 전혀 보여주지 않습니다 — 목적은 딱 하나,
// "출석체크가 진행될수록 정말 많은 동료가 모이고 있다"는 느낌 그 자체를 보여주는 것입니다.
// (1) GN CI 로고가 은은하게 색칠되어 채워지고, (2) 체크인할 때마다 작은 점(동료 한 명)이 하나씩
//     쌓여서, 페이지를 열어둔 채로도 점들이 계속 늘어나는 걸 실시간으로 볼 수 있습니다.
let crowdDotsRendered = 0;

// 초록색 점은 최대 2줄 분량까지만 찍고, 그 이상 출석이 이어져도 점을 더 추가하지 않습니다.
// (CI 로고 채움은 refreshVisuals에서 실제 비율 그대로 계속 진행되며, 이 상한과 무관합니다.)
// 컨테이너 실제 너비를 기준으로 한 줄에 몇 개가 들어가는지 매번 다시 계산합니다(반응형 대응).
const CROWD_MAX_ROWS = 2;
function crowdMaxDots_() {
  const grid = document.getElementById("crowd-grid");
  const w = grid.clientWidth || 300;
  const DOT = 14, GAP = 7; // .crowd-dot 크기 / .crowd-grid gap 과 동일한 값
  const perRow = Math.max(1, Math.floor((w + GAP) / (DOT + GAP)));
  return perRow * CROWD_MAX_ROWS;
}

// 출석자가 1명이라도 있으면(=CI 로고를 100%로 채우는 시점과 동일하게) 초록 점 2줄을 항상
// 꽉 채운 상태로 상시 노출합니다. 실제 출석 인원 수만큼 점진적으로 늘어나던 방식은 더 이상
// 사용하지 않습니다 — 원래대로 되돌리려면 아래 주석 처리된 코드로 교체하면 됩니다.
function growCrowd(count) {
  const grid = document.getElementById("crowd-grid");
  const target = count > 0 ? crowdMaxDots_() : 0;
  if (target === crowdDotsRendered) return;
  grid.innerHTML = "";
  for (let i = 0; i < target; i++) {
    const dot = document.createElement("div");
    dot.className = "crowd-dot";
    grid.appendChild(dot);
  }
  crowdDotsRendered = target;
}
// function growCrowd(count) {
//   const grid = document.getElementById("crowd-grid");
//   const target = Math.min(count, crowdMaxDots_());
//   if (target < crowdDotsRendered) { grid.innerHTML = ""; crowdDotsRendered = 0; }
//   const toAdd = target - crowdDotsRendered;
//   for (let i = 0; i < toAdd; i++) {
//     const dot = document.createElement("div");
//     dot.className = "crowd-dot";
//     grid.appendChild(dot);
//   }
//   crowdDotsRendered = target;
// }

async function refreshVisuals(count) {
  // 원래는 전체 명단 대비 출석 비율만큼 CI 로고를 채웠습니다. 다만 오늘(9/1) 초반 사번 매칭
  // 오류로 실제 출석 가능 인원보다 출석자가 적게 집계된 상태라, 요청에 따라 "지금까지 출석한
  // 인원 = 전체"로 간주해 항상 100%(전체 색칠)로 표시합니다. 실제 명단 대비 비율로 되돌리려면
  // 아래 주석 처리된 코드로 교체하면 됩니다.
  const pct = count > 0 ? 100 : 0;
  // const rc = await API.getRosterCount();
  // const total = rc.ok ? rc.count : 0;
  // const pct = total ? Math.min(100, Math.round((count / total) * 100)) : 0;
  document.getElementById("ci-fill-clip").style.width = pct + "%";
  growCrowd(count);
}

async function refreshList() {
  const res = await API.getAttendanceList();
  refreshVisuals(res.ok ? res.list.length : 0);
}

function checkWindow() {
  const w = isWithinAttendanceWindow();
  const el = document.getElementById("window-notice");
  const btn = document.getElementById("submit-btn");
  if (!w.ok) {
    el.innerHTML = `<div class="notice warning">${w.reason}</div>`;
    btn.disabled = true;
  } else {
    el.innerHTML = "";
    btn.disabled = false;
  }
}

document.getElementById("submit-btn").addEventListener("click", async () => {
  const empId = document.getElementById("empId").value.trim();
  const name = document.getElementById("name").value.trim();
  const resultEl = document.getElementById("result");
  if (!empId || !name) {
    resultEl.innerHTML = '<div class="notice error">사번과 성명을 모두 입력해주세요.</div>';
    return;
  }
  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "확인 중...";
  const res = await API.checkIn({ empId, name });
  btn.disabled = false; btn.textContent = "출석 인증하기";
  const qrUrl = `qr-card.html?empId=${encodeURIComponent(empId)}&name=${encodeURIComponent(name)}`;
  if (res.ok) {
    setMyEmpId(empId);
    setMyName(name);
    resultEl.innerHTML = `
      <div class="notice success">출석 인증이 완료되었습니다. 반갑습니다!</div>
      <a class="btn btn-primary" href="${qrUrl}" style="margin-bottom:14px;">🪪 내 QR 명함 만들러 가기</a>
    `;
    refreshList();
  } else if (String(res.message || "").includes("이미 출석 처리되었습니다")) {
    // 이미 다른 기기(PC 등)에서 출석체크를 완료한 경우입니다. 사번/성명은 명단과 이미 대조되어
    // 유효하다는 뜻이므로, 이 기기(브라우저)에도 신원을 저장해줘야 라이브포럼 등 출석 확인이
    // 필요한 다른 화면들이 이 기기에서도 정상적으로 열립니다.
    setMyEmpId(empId);
    setMyName(name);
    resultEl.innerHTML = `
      <div class="notice info">이미 다른 기기(또는 브라우저)에서 출석체크를 완료하셨네요. 이 기기에도 확인 정보를 저장했어요.</div>
      <a class="btn btn-primary" href="${qrUrl}" style="margin-bottom:14px;">🪪 내 QR 명함 만들러 가기</a>
    `;
  } else {
    resultEl.innerHTML = `<div class="notice error">${res.message}</div>`;
  }
});

checkWindow();
refreshList();
setInterval(refreshList, 8000);
</script>
</body>
</html>
