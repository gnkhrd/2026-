<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>라이브포럼 · 2026년 정책연수</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>라이브포럼</h1>
      <div class="sub">발표자료 및 접속링크</div>
    </div>
  </div>

  <!-- 라이브포럼 실시간 참여 — 외부 링크 2개 (출석체크 여부와 무관하게 항상 노출) -->
  <div class="card" style="padding:16px 14px;">
    <div style="font-weight:800; font-size:14.5px; margin-bottom:10px; text-align:center; color:var(--text);">🎤 라이브포럼 실시간 참여</div>
    <div style="display:flex; gap:10px;">
      <a href="https://app.sli.do/event/d8k1ZE8zR8XRNXGG3pr1LK" target="_blank" rel="noopener"
         style="flex:1; text-decoration:none; color:#fff; background:var(--accent); border-radius:12px; padding:14px 8px; text-align:center;">
        <div style="font-weight:700; font-size:13.5px;">📊 슬라이도 프로그램</div>
        <div style="font-weight:500; font-size:11px; opacity:.85; margin-top:2px;">(클릭)</div>
      </a>
      <a href="https://ox-quiz-900.topvolunteer.chatgpt.site/display?room=7fbf61ae-f334-4fce-8f54-9d579273577c&amp;key=8a2401d1-36f7-430c-a9e9-9645a580b1ee&amp;autoFullscreen=1" target="_blank" rel="noopener"
         style="flex:1; text-decoration:none; color:#fff; background:var(--brown-dark); border-radius:12px; padding:14px 8px; text-align:center;">
        <div style="font-weight:700; font-size:13.5px;">🎉 라이브 퀴즈쇼</div>
        <div style="font-weight:500; font-size:11px; opacity:.85; margin-top:2px;">(클릭)</div>
      </a>
    </div>
  </div>

  <div class="notice info">
    2026년 사회복지법인 굿네이버스 정책연수 라이브포럼 발표자료 파일입니다.<br>
    해당자료에 대한 다운로드, 캡쳐 등은 지양해주시고 외부 유출되지 않도록 주의해주시기 바랍니다.
  </div>

  <!-- 초기 로딩 표시 — 목록을 불러오는 동안 화면이 멈춘 것처럼 보이지 않도록 안내 -->
  <div class="card" id="materials-loading" style="text-align:center; padding:40px 20px;">
    <div style="font-size:13px; color:var(--text-dim);">불러오는 중...</div>
  </div>

  <!-- 네트워크/서버 문제로 목록 자체를 못 불러온 경우 -->
  <div class="card" id="materials-error" style="display:none; text-align:center; padding:32px 20px;">
    <div style="font-size:34px; margin-bottom:10px;">⚠️</div>
    <div style="font-weight:800; font-size:15px; margin-bottom:8px;">자료를 불러오지 못했습니다</div>
    <div id="materials-error-msg" style="font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:18px;"></div>
    <button class="btn btn-primary" id="materials-retry-btn">🔄 다시 시도</button>
  </div>

  <div id="materials-list-wrap" style="display:none;">
    <div class="info-tabs" id="material-tabs" style="display:none;"></div>
    <div id="material-session-label"></div>
    <div class="grid-2" id="doc-list"></div>
  </div>
</div>

<!-- 구글드라이브 원본을 그대로 보여주는 뷰어(팝업) — 구글 자체 인프라로 바로 서빙되어 로딩이 빠르고,
     여러 페이지 넘기기/확대는 드라이브 자체 뷰어 기능을 그대로 사용합니다. -->
<div class="modal-overlay" id="viewer-modal" style="display:none;">
  <div class="modal-sheet pdf-viewer-sheet" id="pdf-viewer-sheet">
    <div class="pdf-viewer-toolbar">
      <div class="pdf-viewer-title" id="viewer-title"></div>
      <div class="pdf-viewer-actions">
        <button class="pdf-viewer-btn" id="viewer-fullscreen" title="전체화면">⛶</button>
        <button class="pdf-viewer-btn" id="viewer-close" title="닫기">✕</button>
      </div>
    </div>
    <div class="pdf-viewer-stage" id="pdf-viewer-stage">
      <div class="pdf-viewer-loading" id="pdf-viewer-loading">불러오는 중...</div>
      <iframe id="drive-viewer-frame" class="drive-viewer-frame" style="display:none;" allow="fullscreen"></iframe>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/mockdata.js"></script>
<script src="assets/api.js"></script>
<script src="assets/util.js"></script>
<script>
let MATERIALS_LIST = [];

/* ---------- 화면 상태 전환 ---------- */
function hideAllStates() {
  document.getElementById("materials-loading").style.display = "none";
  document.getElementById("materials-error").style.display = "none";
  document.getElementById("materials-list-wrap").style.display = "none";
}

function showLoading() {
  hideAllStates();
  document.getElementById("materials-loading").style.display = "";
}

function showErrorState(message) {
  hideAllStates();
  document.getElementById("materials-error-msg").textContent = message || "잠시 후 다시 시도해주세요.";
  document.getElementById("materials-error").style.display = "";
}

function showList() {
  hideAllStates();
  document.getElementById("materials-list-wrap").style.display = "";
}

/* ---------- 자료 목록 ---------- */
// 주제발표/사례발표 제목이 아래 패턴으로 시작하면 해당 세션으로 자동 묶입니다.
// (제목 뒤에 어떤 부제가 붙어도 접두어만 맞으면 인식됩니다 — 예: "주제발표1 지역사회 공동체 기반...")
const MATERIAL_SESSIONS = [
  { label: "Session1. 지역사회 협력 기반 신사회문제 대응과 제도화", match: /^(주제발표1|사례발표1)/ },
  { label: "Session2. 임팩트사업의 성과와 사회적 가치 확산", match: /^(주제발표2|사례발표2)/ },
  { label: "Session3. AI시대, 시스템화를 통한 조직 혁신", match: /^(주제발표3|사례발표3)/ }
];

// "주제발표1) 지역사회 공동체 기반..." 처럼 앞에 붙는 번호표를 따로 떼어내, 번호표 / 나머지 설명
// 두 문단으로 나눠 보여줍니다. 이런 형식이 아닌 제목은 그대로 한 문단으로 표시합니다.
function splitMaterialTitle_(title) {
  const t = String(title || "").trim();
  const m = t.match(/^((?:주제발표|사례발표)\s*\d+(?:-\d+)?\)?)\s*(.*)$/);
  if (m && m[2]) return { label: m[1], desc: m[2] };
  return { label: "", desc: t };
}

function renderDocCard_(m) {
  const idx = MATERIALS_LIST.indexOf(m);
  const { label, desc } = splitMaterialTitle_(m.title);
  return `
    <div class="material-card" data-idx="${idx}">
      <div class="material-card-icon">📄</div>
      ${label ? `<div class="material-card-label">${label}</div>` : ""}
      <div class="material-card-name">${desc}</div>
      <div class="material-card-meta">${m.speaker || ""}</div>
    </div>
  `;
}

let materialGroups = [];   // [{ key, label, items }]
let activeMaterialTab = null;

function buildMaterialGroups_() {
  const groups = MATERIAL_SESSIONS.map((s, i) => ({
    key: "s" + i,
    label: s.label,
    items: MATERIALS_LIST.filter(m => s.match.test(String(m.title || "").trim()))
  })).filter(g => g.items.length);
  const groupedSet = new Set(groups.flatMap(g => g.items));
  const others = MATERIALS_LIST.filter(m => !groupedSet.has(m));
  if (others.length) groups.push({ key: "others", label: "기타 자료", items: others });
  return groups;
}

// 세션 탭은 짧게 "Session1"처럼 표시하고, 전체 명칭은 탭 아래 색상 라벨로 따로 보여줍니다
// (긴 세션명을 탭에 그대로 쓰면 한 줄에 안 들어가기 때문).
function tabShortLabel_(label, key) {
  if (key === "others") return "기타";
  const m = String(label).match(/^Session\d+/);
  return m ? m[0] : label;
}

function renderMaterialTabs_() {
  const wrap = document.getElementById("material-tabs");
  if (!activeMaterialTab || !materialGroups.some(g => g.key === activeMaterialTab)) {
    activeMaterialTab = materialGroups.length ? materialGroups[0].key : null;
  }
  if (materialGroups.length < 2) { wrap.style.display = "none"; wrap.innerHTML = ""; return; }
  wrap.style.display = "";
  wrap.innerHTML = materialGroups.map(g => `
    <button data-key="${g.key}" class="${g.key === activeMaterialTab ? "active" : ""}">${tabShortLabel_(g.label, g.key)}</button>
  `).join("");
  wrap.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeMaterialTab = btn.dataset.key;
      wrap.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
      renderActiveMaterialGroup_();
    });
  });
}

function renderActiveMaterialGroup_() {
  const labelBox = document.getElementById("material-session-label");
  const grid = document.getElementById("doc-list");
  const group = materialGroups.find(g => g.key === activeMaterialTab) || materialGroups[0];
  if (!group) { labelBox.innerHTML = ""; grid.innerHTML = '<div class="empty">등록된 자료가 없습니다.</div>'; return; }
  labelBox.innerHTML = `<div class="material-session-label">${group.label}</div>`;
  grid.innerHTML = group.items.map(renderDocCard_).join("");
  grid.querySelectorAll(".material-card").forEach(el => {
    el.addEventListener("click", () => openViewer(MATERIALS_LIST[+el.dataset.idx]));
  });
}

function renderList() {
  if (!MATERIALS_LIST.length) {
    document.getElementById("material-tabs").style.display = "none";
    document.getElementById("material-session-label").innerHTML = "";
    document.getElementById("doc-list").innerHTML = '<div class="empty">등록된 자료가 없습니다.</div>';
    return;
  }
  materialGroups = buildMaterialGroups_();
  renderMaterialTabs_();
  renderActiveMaterialGroup_();
}

/* ---------- 구글 뷰어(팝업) ---------- */
// 공유링크(예: https://drive.google.com/file/d/{id}/view?usp=sharing)나 파일ID를 그대로 받아
// "새 탭에서 열기" 대체 링크를 만들 때 파일ID만 뽑아냅니다.
function driveFileIdFromRaw(raw) {
  const s = String(raw || "").trim();
  const m = s.match(/\/d\/([^/]+)/) || s.match(/[?&]id=([^&]+)/);
  return m ? m[1] : s;
}

let viewerSession = 0; // 팝업을 닫고 다른 자료를 빠르게 다시 열었을 때, 이전 자료의 지연 타이머가
                        // 새로 연 자료의 화면을 덮어쓰지 않도록 구분하는 용도입니다.

async function openViewer(m) {
  if (!m.file) { alert("아직 업로드되지 않은 자료입니다."); return; }
  const mySession = ++viewerSession;
  const openUrl = `https://drive.google.com/file/d/${driveFileIdFromRaw(m.file)}/view`;

  document.getElementById("viewer-title").textContent = m.title;
  document.getElementById("viewer-modal").style.display = "flex";

  const frame = document.getElementById("drive-viewer-frame");
  const loading = document.getElementById("pdf-viewer-loading");
  frame.style.display = "none";
  loading.style.display = "";
  loading.innerHTML = "불러오는 중...";

  // 열람 기록 — 뷰어 로딩과 별개로 조용히 남겨둡니다(실패해도 열람 자체를 막지 않음).
  API.logMaterialView({ empId: myEmpId(), name: myName(), org: "", materialTitle: m.title }).catch(() => {});

  // 파일 전체를 읽지 않고, 이 파일에 맞는 임베드 주소만 가볍게 받아옵니다 (구글 슬라이드 원본이면
  // 슬라이드 전용 임베드를 써서 모바일에서도 화면을 꽉 채워 보여줍니다).
  const res = await API.getMaterialEmbedUrl({ file: m.file });
  if (mySession !== viewerSession) return; // 그 사이 팝업을 닫고 다른 자료를 열었다면 여기서 중단
  if (!res.ok) {
    loading.innerHTML = `
      <div style="text-align:center;">
        <div style="margin-bottom:12px;">${res.message || "자료를 불러오지 못했습니다."}</div>
        <a href="${openUrl}" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none;">새 탭에서 열기</a>
      </div>`;
    return;
  }

  // 일부 회사 보안 프로그램/브라우저 확장은 구글 드라이브를 iframe(화면 안 팝업)으로 삽입하는 것을
  // 자체적으로 차단합니다 — 이 경우 화면이 검게 멈춘 채로 "불러오는 중"이 끝나지 않습니다.
  // 일정 시간 안에 로딩이 끝나지 않으면 "새 탭에서 열기" 버튼으로 대신 안내해, 어떤 환경에서도
  // 자료를 볼 수 있게 합니다.
  let loaded = false;
  const fallbackTimer = setTimeout(() => {
    if (loaded || mySession !== viewerSession) return;
    loading.innerHTML = `
      <div style="text-align:center;">
        <div style="margin-bottom:12px;">미리보기를 불러오지 못했습니다.<br>보안 프로그램 등이 화면 삽입을 막고 있을 수 있어요.</div>
        <a href="${openUrl}" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none;">새 탭에서 열기</a>
      </div>`;
  }, 6000);

  frame.onload = () => {
    if (mySession !== viewerSession) return;
    loaded = true;
    clearTimeout(fallbackTimer);
    loading.style.display = "none";
    frame.style.display = "";
  };
  frame.src = res.embedUrl;
}

// 전체화면: 아이폰 사파리는 임의 요소의 전체화면 전환을 지원하지 않아 이 기기에서는
// 버튼을 눌러도 동작하지 않을 수 있습니다(브라우저 자체 제약, 우리 쪽에서 우회할 방법이 없음).
document.getElementById("viewer-fullscreen").addEventListener("click", () => {
  const sheet = document.getElementById("pdf-viewer-sheet");
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (isFs) {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  } else {
    const req = sheet.requestFullscreen || sheet.webkitRequestFullscreen;
    if (req) req.call(sheet);
    else alert("이 기기/브라우저에서는 전체화면 전환을 지원하지 않습니다.");
  }
});

document.getElementById("viewer-close").addEventListener("click", () => {
  document.getElementById("viewer-modal").style.display = "none";
  const frame = document.getElementById("drive-viewer-frame");
  frame.src = "about:blank";
});

/* ---------- 시작 ---------- */
// 출석 확인 없이 누구나 바로 목록을 볼 수 있습니다.
async function init() {
  showLoading();
  const res = await API.getMaterials();
  if (!res.ok) { showErrorState(res.message); return; }
  MATERIALS_LIST = res.list || [];
  renderList();
  showList();
}

document.getElementById("materials-retry-btn").addEventListener("click", init);
init();
</script>
</body>
</html>
