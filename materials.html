<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>발표자료 · 2026년 정책연수</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>발표자료</h1>
      <div class="sub">온라인 열람 전용 · 다운로드는 지원하지 않습니다</div>
    </div>
  </div>

  <div class="notice info">
    자료는 구글드라이브에 "뷰어 권한 + 다운로드/인쇄/복사 사용 안함"으로 설정 후 연결하는 방식입니다.
    (파일별 공유 설정에서 지정 가능 — 우클릭 저장 등 완전 차단은 아니며, 일반적인 다운로드 경로를 막는 수준입니다.)
  </div>

  <div class="card" id="doc-list" style="padding:6px 14px;"></div>
</div>

<div class="modal-overlay" id="viewer-modal" style="display:none;">
  <div class="modal-sheet" style="height:88vh; display:flex; flex-direction:column; padding:14px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div id="viewer-title" style="font-weight:700; font-size:14px;"></div>
      <button class="btn btn-secondary" style="width:auto; padding:8px 14px;" id="viewer-close">닫기</button>
    </div>
    <div style="flex:1; border-radius:12px; overflow:hidden; background:#000;">
      <iframe id="viewer-frame" style="width:100%; height:100%; border:none;"></iframe>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/mockdata.js"></script>
<script src="assets/api.js"></script>
<script src="assets/util.js"></script>
<script>
function driveEmbedUrl(fileIdOrUrl) {
  if (!fileIdOrUrl) return "";
  // 시트에 "보기(view)" 전체 링크를 넣든, 파일ID만 넣든 상관없이
  // 항상 파일ID만 뽑아서 임베드 전용 주소(/preview)로 변환합니다.
  // 드라이브의 일반 "보기" 링크는 다른 사이트의 iframe 안에서 열리는 걸
  // 막아둔 경우가 있어(특히 PDF), 반드시 /preview 형태를 써야 합니다.
  let id = String(fileIdOrUrl).trim();
  const m = id.match(/\/d\/([^/]+)/);
  if (m) id = m[1];
  return `https://drive.google.com/file/d/${id}/preview`;
}

async function load() {
  const res = await API.getMaterials();
  const wrap = document.getElementById("doc-list");
  if (!res.ok || !res.list.length) { wrap.innerHTML = '<div class="empty">등록된 자료가 없습니다.</div>'; return; }
  wrap.innerHTML = res.list.map((m, i) => `
    <div class="doc-list-item" data-idx="${i}" style="cursor:pointer;">
      <div class="icon">📄</div>
      <div style="flex:1;">
        <div class="name">${m.title}</div>
        <div class="meta">${m.speaker || ""}</div>
      </div>
      <div style="color:var(--text-faint);">›</div>
    </div>
  `).join("");
  wrap.querySelectorAll(".doc-list-item").forEach(el => {
    el.addEventListener("click", () => {
      const m = res.list[+el.dataset.idx];
      if (!m.file) { alert("아직 업로드되지 않은 자료입니다."); return; }
      document.getElementById("viewer-title").textContent = m.title;
      document.getElementById("viewer-frame").src = driveEmbedUrl(m.file);
      document.getElementById("viewer-modal").style.display = "flex";
    });
  });
}

document.getElementById("viewer-close").addEventListener("click", () => {
  document.getElementById("viewer-frame").src = "";
  document.getElementById("viewer-modal").style.display = "none";
});

load();
</script>
</body>
</html>
