<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>발표자료 · 2026년 정책연수</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>발표자료</h1>
      <div class="sub">온라인 열람 전용(다운로드 불가)</div>
    </div>
  </div>

  <!-- 라이브포럼 실시간 참여 — 외부 링크 2개 (출석체크 여부와 무관하게 항상 노출) -->
  <div class="card" style="padding:16px 14px;">
    <div style="font-weight:800; font-size:14.5px; margin-bottom:10px; text-align:center; color:var(--text);">🎤 라이브포럼 실시간 참여</div>
    <div style="display:flex; gap:10px;">
      <a href="https://app.sli.do/event/d8k1ZE8zR8XRNXGG3pr1LK" target="_blank" rel="noopener"
         style="flex:1; text-decoration:none; color:#fff; background:var(--accent); border-radius:12px; padding:14px 8px; text-align:center;">
        <div style="font-weight:700; font-size:13.5px;">📊 슬라이도 프로그램</div>
        <div style="font-weight:500; font-size:11px; opacity:.85; margin-top:2px;">(클릭)</div>
      </a>
      <a href="https://ox-quiz-900.topvolunteer.chatgpt.site/display?room=7fbf61ae-f334-4fce-8f54-9d579273577c&amp;key=8a2401d1-36f7-430c-a9e9-9645a580b1ee&amp;autoFullscreen=1" target="_blank" rel="noopener"
         style="flex:1; text-decoration:none; color:#fff; background:var(--brown-dark); border-radius:12px; padding:14px 8px; text-align:center;">
        <div style="font-weight:700; font-size:13.5px;">🎉 라이브 퀴즈쇼</div>
        <div style="font-weight:500; font-size:11px; opacity:.85; margin-top:2px;">(클릭)</div>
      </a>
    </div>
  </div>

  <div class="notice info">
    2026년 사회복지법인 굿네이버스 정책연수 발표자료 파일입니다.<br>
    해당자료에 대한 다운로드, 캡쳐 등은 지양해주시고 외부 유출되지 않도록 주의해주시기 바랍니다.
  </div>

  <!-- 초기 로딩 표시 — 서버 확인이 끝나기 전까지 화면이 멈춘 것처럼 보이지 않도록 안내 -->
  <div class="card" id="materials-loading" style="text-align:center; padding:40px 20px;">
    <div style="font-size:13px; color:var(--text-dim);">불러오는 중...</div>
  </div>

  <!-- 출석체크를 완료하지 않으면 이 화면이 대신 노출됩니다 -->
  <div class="card" id="materials-gate" style="display:none; text-align:center; padding:32px 20px;">
    <div style="font-size:34px; margin-bottom:10px;">🔒</div>
    <div style="font-weight:800; font-size:15px; margin-bottom:8px;">출석체크 후 열람할 수 있습니다</div>
    <div style="font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:18px;">
      발표자료는 출석체크를 완료하신 분만 확인할 수 있어요.<br>먼저 출석체크를 진행해주세요.
    </div>
    <a class="btn btn-primary" href="attendance.html">✅ 출석체크 하러 가기</a>
  </div>

  <!-- 출석 여부와 무관하게, 네트워크/서버 문제로 확인 자체가 안 된 경우 -->
  <div class="card" id="materials-error" style="display:none; text-align:center; padding:32px 20px;">
    <div style="font-size:34px; margin-bottom:10px;">⚠️</div>
    <div style="font-weight:800; font-size:15px; margin-bottom:8px;">자료를 불러오지 못했습니다</div>
    <div id="materials-error-msg" style="font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:18px;"></div>
    <button class="btn btn-primary" id="materials-retry-btn">🔄 다시 시도</button>
  </div>

  <div class="card" id="doc-list" style="padding:6px 14px; display:none;"></div>
</div>

<!-- pdf.js 커스텀 뷰어: 전체화면 / 회전 / 화면크기에 맞춘 자동배율 / 클릭으로 페이지 넘기기 지원 -->
<div class="modal-overlay" id="viewer-modal" style="display:none;">
  <div class="modal-sheet pdf-viewer-sheet" id="pdf-viewer-sheet">
    <div class="pdf-viewer-toolbar">
      <div class="pdf-viewer-title" id="viewer-title"></div>
      <div class="pdf-viewer-actions">
        <button class="pdf-viewer-btn" id="viewer-rotate" title="화면 회전">⟳</button>
        <button class="pdf-viewer-btn" id="viewer-fullscreen" title="전체화면">⛶</button>
        <button class="pdf-viewer-btn" id="viewer-close" title="닫기">✕</button>
      </div>
    </div>
    <div class="pdf-viewer-stage" id="pdf-viewer-stage">
      <div class="pdf-viewer-loading" id="pdf-viewer-loading">불러오는 중...</div>
      <div class="pdf-viewer-error" id="pdf-viewer-error" style="display:none;"></div>
      <canvas id="pdf-canvas" style="display:none;"></canvas>
      <div class="pdf-viewer-navzone left" id="pdf-nav-prev" title="이전 페이지"></div>
      <div class="pdf-viewer-navzone right" id="pdf-nav-next" title="다음 페이지"></div>
    </div>
    <div class="pdf-viewer-footer">
      <button class="pdf-viewer-navbtn" id="pdf-prev-btn">‹ 이전</button>
      <div class="pdf-viewer-page-indicator" id="pdf-page-indicator">1 / 1</div>
      <button class="pdf-viewer-navbtn" id="pdf-next-btn">다음 ›</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/mockdata.js"></script>
<script src="assets/api.js"></script>
<script src="assets/util.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

let MATERIALS_LIST = [];

/* ---------- 화면 상태 전환 ---------- */
function hideAllStates() {
  document.getElementById("materials-loading").style.display = "none";
  document.getElementById("materials-gate").style.display = "none";
  document.getElementById("materials-error").style.display = "none";
  document.getElementById("doc-list").style.display = "none";
}

function showLoading() {
  hideAllStates();
  document.getElementById("materials-loading").style.display = "";
}

function showGate() {
  hideAllStates();
  document.getElementById("materials-gate").style.display = "";
}

function showErrorState(message) {
  hideAllStates();
  document.getElementById("materials-error-msg").textContent = message || "잠시 후 다시 시도해주세요.";
  document.getElementById("materials-error").style.display = "";
}

function showList() {
  hideAllStates();
  document.getElementById("doc-list").style.display = "";
}

/* ---------- 자료 목록 ---------- */
// getMaterialsGate 응답으로 이미 받아온 목록을 화면에 그리기만 합니다 (별도 서버 호출 없음).
function renderList() {
  const wrap = document.getElementById("doc-list");
  if (!MATERIALS_LIST.length) { wrap.innerHTML = '<div class="empty">등록된 자료가 없습니다.</div>'; return; }
  wrap.innerHTML = MATERIALS_LIST.map((m, i) => `
    <div class="doc-list-item" data-idx="${i}" style="cursor:pointer;">
      <div class="icon">📄</div>
      <div style="flex:1;">
        <div class="name">${m.title}</div>
        <div class="meta">${m.speaker || ""}</div>
      </div>
      <div style="color:var(--text-faint);">›</div>
    </div>
  `).join("");
  wrap.querySelectorAll(".doc-list-item").forEach(el => {
    el.addEventListener("click", () => openViewer(MATERIALS_LIST[+el.dataset.idx]));
  });
}

/* ---------- pdf.js 커스텀 뷰어 ---------- */
let pdfDoc = null;
let pdfCurrentPage = 1;
let pdfRotation = 0;
let pdfResizeTimer = null;

/* ---------- 핀치 확대 / 이동 (일부 안드로이드 기기는 페이지 전체 확대가 막혀있어 직접 구현) ---------- */
let pdfZoomScale = 1;
let pdfPanX = 0, pdfPanY = 0;
let pdfPinchStartDist = 0, pdfPinchStartScale = 1;
let pdfPanStartX = 0, pdfPanStartY = 0, pdfPanOriginX = 0, pdfPanOriginY = 0;
let pdfLastTapTime = 0;

function applyPdfZoomTransform() {
  const canvas = document.getElementById("pdf-canvas");
  canvas.style.transform = `translate(${pdfPanX}px, ${pdfPanY}px) scale(${pdfZoomScale})`;
  const zoomed = pdfZoomScale > 1.02;
  document.getElementById("pdf-nav-prev").style.pointerEvents = zoomed ? "none" : "";
  document.getElementById("pdf-nav-next").style.pointerEvents = zoomed ? "none" : "";
}

function resetPdfZoom() {
  pdfZoomScale = 1; pdfPanX = 0; pdfPanY = 0;
  applyPdfZoomTransform();
}

function pdfTouchDist(t1, t2) {
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}

(function setupPdfPinchZoom() {
  const stage = document.getElementById("pdf-viewer-stage");

  stage.addEventListener("touchstart", (e) => {
    if (!pdfDoc) return;
    if (e.touches.length === 2) {
      pdfPinchStartDist = pdfTouchDist(e.touches[0], e.touches[1]);
      pdfPinchStartScale = pdfZoomScale;
    } else if (e.touches.length === 1 && pdfZoomScale > 1.02) {
      pdfPanStartX = e.touches[0].clientX;
      pdfPanStartY = e.touches[0].clientY;
      pdfPanOriginX = pdfPanX;
      pdfPanOriginY = pdfPanY;
    }
  }, { passive: true });

  stage.addEventListener("touchmove", (e) => {
    if (!pdfDoc) return;
    if (e.touches.length === 2) {
      e.preventDefault();
      if (pdfPinchStartDist > 0) {
        const dist = pdfTouchDist(e.touches[0], e.touches[1]);
        pdfZoomScale = Math.max(1, Math.min(4, pdfPinchStartScale * (dist / pdfPinchStartDist)));
        applyPdfZoomTransform();
      }
    } else if (e.touches.length === 1 && pdfZoomScale > 1.02) {
      e.preventDefault();
      pdfPanX = pdfPanOriginX + (e.touches[0].clientX - pdfPanStartX);
      pdfPanY = pdfPanOriginY + (e.touches[0].clientY - pdfPanStartY);
      applyPdfZoomTransform();
    }
  }, { passive: false });

  stage.addEventListener("touchend", (e) => {
    if (!pdfDoc || e.touches.length > 0) return;
    if (pdfZoomScale < 1.05) resetPdfZoom(); // 살짝 확대된 상태로 손을 뗐다면 원래 크기로 정리
    // 더블탭으로도 확대/원상복구를 전환할 수 있게 보조 지원 (핀치가 익숙하지 않은 경우용)
    const now = Date.now();
    if (now - pdfLastTapTime < 300) {
      pdfZoomScale = pdfZoomScale > 1.02 ? 1 : 2.2;
      pdfPanX = 0; pdfPanY = 0;
      applyPdfZoomTransform();
    }
    pdfLastTapTime = now;
  });
})();

function viewerEls() {
  return {
    stage: document.getElementById("pdf-viewer-stage"),
    canvas: document.getElementById("pdf-canvas"),
    loading: document.getElementById("pdf-viewer-loading"),
    error: document.getElementById("pdf-viewer-error"),
    pageIndicator: document.getElementById("pdf-page-indicator")
  };
}

async function openViewer(m) {
  if (!m.file) { alert("아직 업로드되지 않은 자료입니다."); return; }
  document.getElementById("viewer-title").textContent = m.title;
  document.getElementById("viewer-modal").style.display = "flex";

  const { canvas, loading, error } = viewerEls();
  canvas.style.display = "none";
  error.style.display = "none";
  loading.style.display = "";
  loading.textContent = "불러오는 중...";
  pdfDoc = null;
  pdfCurrentPage = 1;
  pdfRotation = 0;

  // 열람 기록 — 뷰어 로딩과 별개로 조용히 남겨둡니다(실패해도 열람 자체를 막지 않음).
  API.logMaterialView({ empId: myEmpId(), name: myName(), org: "", materialTitle: m.title }).catch(() => {});

  const fileRes = await API.getMaterialFile({ file: m.file });
  if (!fileRes.ok) {
    loading.style.display = "none";
    error.textContent = fileRes.message || "자료를 불러오지 못했습니다.";
    error.style.display = "";
    return;
  }

  try {
    const binary = atob(fileRes.base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
    loading.style.display = "none";
    canvas.style.display = "";
    await renderPdfPage(1);
  } catch (e) {
    loading.style.display = "none";
    error.textContent = "자료를 표시하는 중 문제가 발생했습니다.";
    error.style.display = "";
  }
}

async function renderPdfPage(num) {
  if (!pdfDoc) return;
  resetPdfZoom(); // 페이지가 바뀌면 확대 상태를 정리합니다
  num = Math.max(1, Math.min(num, pdfDoc.numPages));
  pdfCurrentPage = num;
  const page = await pdfDoc.getPage(num);
  const { stage, canvas, pageIndicator } = viewerEls();

  const baseViewport = page.getViewport({ scale: 1, rotation: pdfRotation });
  const availW = Math.max(stage.clientWidth - 16, 100);
  const availH = Math.max(stage.clientHeight - 16, 100);
  const cssScale = Math.max(Math.min(availW / baseViewport.width, availH / baseViewport.height), 0.1);

  // 화면에 보여지는 크기(cssScale)와, 실제로 그려넣을 캔버스 해상도를 분리합니다.
  // 갤럭시 등 고해상도(레티나) 화면은 픽셀 밀도가 1보다 훨씬 높은데, 이걸 반영하지 않고
  // 화면 크기 그대로만 그리면 글자 획이 뭉개져 "깨진" 것처럼 보입니다. devicePixelRatio를
  // 곱해서 더 촘촘하게 그린 뒤, 화면에는 원래 크기로 보여주면 선명해집니다.
  // (배율이 너무 크면 렌더링이 느려지므로 2.5배까지만 반영합니다.)
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cssViewport = page.getViewport({ scale: cssScale, rotation: pdfRotation });
  const renderViewport = page.getViewport({ scale: cssScale * dpr, rotation: pdfRotation });

  canvas.width = renderViewport.width;
  canvas.height = renderViewport.height;
  canvas.style.width = cssViewport.width + "px";
  canvas.style.height = cssViewport.height + "px";

  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;
  pageIndicator.textContent = `${num} / ${pdfDoc.numPages}`;
}

function pdfGoTo(delta) {
  if (!pdfDoc) return;
  renderPdfPage(pdfCurrentPage + delta);
}

document.getElementById("pdf-prev-btn").addEventListener("click", () => pdfGoTo(-1));
document.getElementById("pdf-next-btn").addEventListener("click", () => pdfGoTo(1));
document.getElementById("pdf-nav-prev").addEventListener("click", () => pdfGoTo(-1));
document.getElementById("pdf-nav-next").addEventListener("click", () => pdfGoTo(1));

document.getElementById("viewer-rotate").addEventListener("click", () => {
  pdfRotation = (pdfRotation + 90) % 360;
  renderPdfPage(pdfCurrentPage);
});

// 전체화면: 아이폰 사파리는 임의 요소의 전체화면 전환을 지원하지 않아 이 기기에서는
// 버튼을 눌러도 동작하지 않을 수 있습니다(브라우저 자체 제약, 우리 쪽에서 우회할 방법이 없음).
document.getElementById("viewer-fullscreen").addEventListener("click", () => {
  const sheet = document.getElementById("pdf-viewer-sheet");
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (isFs) {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  } else {
    const req = sheet.requestFullscreen || sheet.webkitRequestFullscreen;
    if (req) req.call(sheet);
    else alert("이 기기/브라우저에서는 전체화면 전환을 지원하지 않습니다.");
  }
});

document.addEventListener("fullscreenchange", () => { if (pdfDoc) renderPdfPage(pdfCurrentPage); });
document.addEventListener("webkitfullscreenchange", () => { if (pdfDoc) renderPdfPage(pdfCurrentPage); });

window.addEventListener("resize", () => {
  if (!pdfDoc) return;
  clearTimeout(pdfResizeTimer);
  pdfResizeTimer = setTimeout(() => renderPdfPage(pdfCurrentPage), 200);
});

document.getElementById("viewer-close").addEventListener("click", () => {
  document.getElementById("viewer-modal").style.display = "none";
  pdfDoc = null;
  resetPdfZoom();
});

/* ---------- 시작 ---------- */
// 출석 확인 + 자료 목록을 한 번의 요청으로 함께 받습니다 (기존 2회 왕복 → 1회로 단축).
async function init() {
  showLoading();
  const empId = myEmpId(), name = myName();
  const res = await API.getMaterialsGate({ empId, name });
  if (!res.ok) { showErrorState(res.message); return; } // 네트워크/서버 문제 — 출석 미확인과는 다른 안내
  if (!res.attended) { showGate(); return; }
  MATERIALS_LIST = res.list || [];
  renderList();
  showList();
}

document.getElementById("materials-retry-btn").addEventListener("click", init);
init();
</script>
</body>
</html>
