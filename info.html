<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>기타 안내 · 2026년 정책연수</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>기타 안내</h1>
      <div class="sub">자리배치표 · 방배정표 · 식사장소 · 설문조사</div>
    </div>
  </div>

  <div class="info-tabs" id="info-tabs">
    <button data-tab="seating">자리배치표</button>
    <button data-tab="room">방배정표</button>
    <button data-tab="mealplace">식사장소</button>
    <button data-tab="survey">설문조사</button>
  </div>

  <!-- 탭을 아무것도 누르지 않은 초기 상태 -->
  <div class="tab-panel active" id="tab-empty">
    <div class="card"><div class="empty">위 탭을 눌러 원하는 정보를 확인해주세요.</div></div>
  </div>

  <!-- ============ 탭 0: 자리배치표 ============ -->
  <div class="tab-panel" id="tab-seating">
    <div class="section-title">
      <span>🪑 자리배치표</span>
    </div>
    <div class="card" id="seating-chart-box" style="padding:14px; text-align:center;">
      <div class="empty">이미지가 아직 등록되지 않았습니다.</div>
    </div>
  </div>

  <!-- ============ 탭 1: 방배정표 ============ -->
  <div class="tab-panel" id="tab-room">

    <div class="section-title">
      <span>🛏️ 내 방 찾기</span>
    </div>
    <div class="card" id="room-my-box">
      <div class="empty">확인 중...</div>
    </div>

    <div class="section-title">
      <span>🗺️ 연수원 지도</span>
    </div>
    <div class="card" id="venue-map-box" style="padding:14px; text-align:center;">
      <div class="empty">지도 이미지가 아직 등록되지 않았습니다.</div>
    </div>

    <details class="card" id="room-full-list-toggle" style="padding:14px;">
      <summary style="cursor:pointer; font-weight:700; font-size:14px;">📋 전체 방배정 명단 보기</summary>
      <div id="room-full-list-body" style="margin-top:12px;">
        <div class="empty">눌러서 불러오세요.</div>
      </div>
    </details>
  </div>

  <!-- ============ 탭 2: 식사장소 ============ -->
  <div class="tab-panel" id="tab-mealplace">

    <div class="section-title">
      <span>🍳 조식</span>
    </div>
    <div class="card" id="meal-breakfast-box" style="padding:14px; text-align:center;">
      <div class="empty">이미지가 아직 등록되지 않았습니다.</div>
    </div>

    <div class="section-title">
      <span>🍚 중식/석식</span>
    </div>
    <div class="card" id="meal-lunch-box" style="padding:14px; text-align:center;">
      <div class="empty">이미지가 아직 등록되지 않았습니다.</div>
    </div>

  </div>

  <!-- ============ 탭 3: 설문조사 ============ -->
  <div class="tab-panel" id="tab-survey">
    <div class="section-title">
      <span>🗳️ 설문조사</span>
    </div>
    <div class="card" id="survey-tab-box" style="text-align:center; padding:28px 20px;"></div>
  </div>

</div>

<script src="assets/config.js"></script>
<script src="assets/mockdata.js"></script>
<script src="assets/api.js"></script>
<script src="assets/util.js"></script>
<script>
/* ---------- 탭 전환 ---------- */
document.getElementById("info-tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  document.querySelectorAll("#info-tabs button").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + btn.dataset.tab));
});

/* ---------- 내 방 찾기: 출석체크 때 저장된 사번/성명을 자동으로 사용 ---------- */
// 같은 방에 배정된 사람들 중, 스프레드시트에서 가장 위에 있는(=먼저 등록된) 사람이 방키를
// 수령하기로 되어 있으므로, 방배정표 원래 순서(list) 그대로에서 해당 방의 첫 번째 사람을 찾습니다.
function findKeyHolder(list, room) {
  const r = String(room || "").trim();
  if (!r) return null;
  return list.find(row => String(row.room || "").trim() === r) || null;
}

function keyHolderLine_(keyHolder, person) {
  if (!keyHolder || !person || !person.room) return "";
  const mine = String(keyHolder.empId) === String(person.empId);
  return `<br>방키 수령직원: <b>${keyHolder.name}</b>${mine ? " (본인)" : ""}`;
}

// 같은 방에 배정된 다른 사람들 이름 목록 (본인 제외)
function roommatesOf_(list, person) {
  const r = String(person.room || "").trim();
  if (!r) return [];
  return list.filter(row => String(row.room || "").trim() === r && String(row.empId) !== String(person.empId));
}

function roommatesLine_(list, person) {
  if (!person || !person.room) return "";
  const mates = roommatesOf_(list, person);
  if (!mates.length) return "";
  return `<br>함께 지내는 직원: <b>${mates.map(m => m.name).join(", ")}</b>`;
}

function renderMyRoomBox(match, rosterHit, empId, name, list) {
  const box = document.getElementById("room-my-box");
  if (match) {
    const keyHolder = findKeyHolder(list, match.room);
    box.innerHTML = `
      <div class="notice success">
        <b>${match.name}</b>님 (${match.empId}) · ${match.org || ""}<br>
        배정된 방: <b>${match.room || "미배정"}</b>${roommatesLine_(list, match)}${keyHolderLine_(keyHolder, match)}
      </div>
      <div style="font-size:12px; color:var(--text-faint); margin-top:6px;">출석체크 정보로 자동 확인되었습니다.</div>
    `;
    return;
  }
  if (empId && name && !rosterHit) {
    box.innerHTML = `
      <div class="notice info">별도로 배정된 방이 없습니다. 현장 안내데스크에서 확인해주세요.</div>
      <div style="font-size:12px; color:var(--text-faint); margin-top:6px;">(${name}님, ${empId} 기준 자동 확인)</div>
    `;
    return;
  }
  // 저장된 신원 정보가 없는 경우 (아직 출석체크 전) — 수동 검색 폼 표시
  box.innerHTML = `
    <div class="notice info">출석체크를 하시면 이 자리에 내 방이 자동으로 표시됩니다. 그 전에는 아래에서 직접 확인해보세요.</div>
    <div class="field">
      <label>사번</label>
      <input type="text" id="room-empId" autocapitalize="characters" placeholder="예: A10001">
    </div>
    <div class="field">
      <label>성명</label>
      <input type="text" id="room-name" placeholder="예: 김민준">
    </div>
    <div id="room-manual-result"></div>
    <button class="btn btn-primary" id="room-submit-btn">내 방 확인하기</button>
  `;
  document.getElementById("room-submit-btn").addEventListener("click", async () => {
    const eid = document.getElementById("room-empId").value.trim();
    const nm = document.getElementById("room-name").value.trim();
    const el = document.getElementById("room-manual-result");
    if (!eid || !nm) { el.innerHTML = '<div class="notice error">사번과 성명을 모두 입력해주세요.</div>'; return; }
    const res = await API.getRoomAssignment();
    if (!res.ok) { el.innerHTML = `<div class="notice error">${res.message || "조회 중 오류가 발생했습니다."}</div>`; return; }
    const hit = res.list.find(r => String(r.name).trim() === nm);
    const m = res.list.find(r => String(r.empId).trim() === eid && String(r.name).trim() === nm);
    if (!m && !hit) { el.innerHTML = '<div class="notice info">별도로 배정된 방이 없습니다. 현장 안내데스크에서 확인해주세요.</div>'; return; }
    if (!m) { el.innerHTML = '<div class="notice error">명단에서 사번/성명을 찾을 수 없습니다. 다시 확인해주세요.</div>'; return; }
    const keyHolder = findKeyHolder(res.list, m.room);
    el.innerHTML = `<div class="notice success"><b>${m.name}</b>님 (${m.empId}) · ${m.org || ""}<br>배정된 방: <b>${m.room || "미배정"}</b>${roommatesLine_(res.list, m)}${keyHolderLine_(keyHolder, m)}</div>`;
  });
}

// 방배정 명단은 "내 방 찾기"와 "전체 명단 보기" 둘 다에서 쓰이므로, 한 번만 받아서 재사용합니다.
let ROOM_ALL = null;

async function fetchRoomAssignment_() {
  if (ROOM_ALL !== null) return ROOM_ALL;
  const res = await API.getRoomAssignment();
  ROOM_ALL = res.ok ? res.list : [];
  return ROOM_ALL;
}

async function loadMyRoom() {
  const empId = myEmpId();
  const name = myName();
  if (!empId || !name) { renderMyRoomBox(null, null, "", "", []); return; }
  const list = await fetchRoomAssignment_();
  if (!list) {
    document.getElementById("room-my-box").innerHTML = '<div class="notice error">조회 중 오류가 발생했습니다.</div>';
    return;
  }
  const rosterHit = list.find(r => String(r.name).trim() === name);
  const match = list.find(r => String(r.empId).trim() === empId && String(r.name).trim() === name);
  renderMyRoomBox(match, rosterHit, empId, name, list);
}

/* ---------- 전체 방배정 명단: 방번호별로 묶어서 2개씩 나란히 표시 (토글을 열 때만 불러옴) ---------- */
function groupByRoom_(list) {
  const map = {};
  const order = [];
  list.forEach(r => {
    const room = String(r.room || "").trim();
    if (!room) return; // 미배정 인원은 명단에서 제외
    if (!map[room]) { map[room] = []; order.push(room); }
    map[room].push(r.name);
  });
  order.sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
  return order.map(room => ({ room, names: map[room] }));
}

function renderFullRoomList(list) {
  const wrap = document.getElementById("room-full-list-body");
  const groups = groupByRoom_(list);
  if (!groups.length) { wrap.innerHTML = '<div class="empty">등록된 방배정 정보가 없습니다.</div>'; return; }

  // 이름 칸은 4개까지는 쉼표 없이 각자 한 칸씩 쓰고, 5명이 넘는 경우에만 마지막 칸에 나머지를 쉼표로 묶습니다.
  const cellsOf = (g) => {
    if (!g) return "<td></td><td></td><td></td><td></td><td></td>";
    const shown = g.names.slice(0, 4);
    if (g.names.length > 4) shown[3] = g.names.slice(3).join(", ");
    while (shown.length < 4) shown.push("");
    return `<td>${g.room}</td><td>${shown[0] || ""}</td><td>${shown[1] || ""}</td><td>${shown[2] || ""}</td><td>${shown[3] || ""}</td>`;
  };

  const rows = [];
  for (let i = 0; i < groups.length; i += 2) {
    rows.push(`<tr>${cellsOf(groups[i])}${cellsOf(groups[i + 1])}</tr>`);
  }

  wrap.innerHTML = `
    <div class="att-table-wrap room-full-table-wrap">
      <table class="att-table room-full-table">
        <thead>
          <tr><th>방번호</th><th colspan="4">이름</th><th>방번호</th><th colspan="4">이름</th></tr>
        </thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>
  `;
}

let roomFullListLoaded = false;
document.getElementById("room-full-list-toggle").addEventListener("toggle", async (e) => {
  if (!e.target.open || roomFullListLoaded) return;
  roomFullListLoaded = true;
  document.getElementById("room-full-list-body").innerHTML = '<div class="empty">불러오는 중...</div>';
  const list = await fetchRoomAssignment_();
  renderFullRoomList(list);
});

/* ---------- 자리배치표 이미지 ---------- */
function loadSeatingChart() {
  const box = document.getElementById("seating-chart-box");
  const src = driveImageUrl(window.CONFIG.SEATING_CHART_IMAGE);
  if (!src) return; // 기본 "준비 중" 안내 유지
  box.innerHTML = `<img src="${src}" alt="자리배치표" style="max-width:100%; border-radius:12px;">`;
}

/* ---------- 연수원 지도 이미지 ---------- */
function driveImageUrl(fileIdOrUrl) {
  if (!fileIdOrUrl) return "";
  let id = String(fileIdOrUrl).trim();
  const m = id.match(/\/d\/([^/]+)/);
  if (m) id = m[1];
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;
}

function loadVenueMap() {
  const box = document.getElementById("venue-map-box");
  const src = driveImageUrl(window.CONFIG.VENUE_MAP_IMAGE);
  if (!src) return; // 기본 "준비 중" 안내 유지
  box.innerHTML = `
    <img src="${src}" alt="연수원 지도" style="max-width:100%; border-radius:12px;">
    <div style="font-size:12px; color:var(--text-faint); margin-top:8px;">S : 스테이 타워 (그랜드홀이 있는 건물) · P : 플렉스 타워 (워터파크 있는 건물)</div>
  `;
}

/* ---------- 식사장소: 조식(이미지 1장) + 중식/석식(이미지 1장 + 하단 좌/우 권역 문구, 중식·석식 공통) ---------- */
function renderMealImageBox(elId, imageValue) {
  const box = document.getElementById(elId);
  const src = driveImageUrl(imageValue);
  if (!src) return; // 기본 "준비 중" 안내 유지
  box.innerHTML = `<img src="${src}" alt="식사장소 이미지" style="max-width:100%; border-radius:12px;">`;
}

function renderLunchBox() {
  const c = window.CONFIG;
  const box = document.getElementById("meal-lunch-box");
  const src = driveImageUrl(c.MEALPLACE_LUNCH_IMAGE);
  if (!src) return; // 기본 "준비 중" 안내 유지
  const left = c.MEALPLACE_LUNCH_LEFT_REGIONS;
  const right = c.MEALPLACE_LUNCH_RIGHT_REGIONS;
  const captionRow = (left || right) ? `
    <div class="mealplace-split" style="margin:10px 0 0;">
      <div style="font-size:15px; font-weight:800; color:var(--text-dim); line-height:1.3; overflow-wrap:break-word; word-break:keep-all; text-align:center;">${left ? `좌: ${left}` : ""}</div>
      <div style="font-size:15px; font-weight:800; color:var(--text-dim); line-height:1.3; overflow-wrap:break-word; word-break:keep-all; text-align:center;">${right ? `우: ${right}` : ""}</div>
    </div>
  ` : "";
  box.innerHTML = `<img src="${src}" alt="중식/석식 장소" style="max-width:100%; border-radius:12px;">${captionRow}`;
}

function loadMealPlaceImages() {
  renderMealImageBox("meal-breakfast-box", window.CONFIG.MEALPLACE_BREAKFAST_IMAGE);
  renderLunchBox();
}

/* ---------- 설문조사: 구글폼 링크, 지정 시각부터 노출(상시오픈) ---------- */
function isSurveyTabOpen() {
  const cfg = window.CONFIG.SURVEY_TAB_OPEN_AT;
  if (!cfg) return true;
  const kst = nowKST();
  if (kst.date < cfg.date) return false;
  if (kst.date === cfg.date && kst.hhmm < cfg.time) return false;
  return true;
}

function loadSurveyTab() {
  const box = document.getElementById("survey-tab-box");
  const cfg = window.CONFIG.SURVEY_TAB_OPEN_AT;
  if (!isSurveyTabOpen()) {
    box.innerHTML = `<div class="empty">설문조사는 ${cfg ? cfg.date + " " + cfg.time : "행사 종료 후"}부터 작성할 수 있습니다.</div>`;
    return;
  }
  const url = window.CONFIG.SURVEY_FORM_URL;
  if (!url) {
    box.innerHTML = '<div class="empty">설문조사 링크가 아직 등록되지 않았습니다.</div>';
    return;
  }
  box.innerHTML = `
    <div style="font-size:15px; color:var(--text-dim); margin-bottom:18px; line-height:1.5;">
      설문조사는 구글폼으로 진행됩니다.<br>아래 버튼을 누르면 새 창에서 설문을 작성할 수 있어요.
    </div>
    <a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">📝 설문조사 작성하러 가기</a>
  `;
}

loadSeatingChart();
loadMyRoom();
loadVenueMap();
loadMealPlaceImages();
loadSurveyTab();
</script>
</body>
</html>
